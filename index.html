<!-- SCRIPT PRINCIPAL DE LÓGICA Y CÁLCULOS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6jvnsXZwF2anOJo3VadfNvn7Fl6Z5efY",
            authDomain: "sistema-mac-reportes.firebaseapp.com",
            databaseURL: "https://sistema-mac-reportes-default-rtdb.firebaseio.com",
            projectId: "sistema-mac-reportes",
            storageBucket: "sistema-mac-reportes.firebasestorage.app",
            messagingSenderId: "776250701305",
            appId: "1:776250701305:web:ac542564b7f7a136cef928"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        window.dbVideos = [];
        window.dbCalendario = [];
        window.FECHA_ACTUAL = new Date().toISOString().split('T')[0];

        function generarIdExcel(n) {
            let result = "";
            let num = n;
            while (num >= 0) {
                result = String.fromCharCode(65 + (num % 26)) + result;
                num = Math.floor(num / 26) - 1;
            }
            return result;
        }
        window.generarIdExcel = generarIdExcel;

        function duracionASegundos(dur) {
            if (!dur) return 30;
            const partes = dur.split(':').map(Number);
            if (partes.length === 3) {
                return partes[0] * 3600 + partes[1] * 60 + partes[2];
            } else if (partes.length === 2) {
                return partes[0] * 60 + partes[1];
            }
            return 30;
        }

        // Declarada primero para evitar errores de referencia
        function procesarCalculosAutomaticos() {
            const festivosSet = new Set(window.dbCalendario.filter(c => c.tipo === 'festivo').map(c => c.fecha));
            const adicionalesSet = new Set(window.dbCalendario.filter(c => c.tipo === 'adicional').map(c => c.fecha));
            const hoyStr = window.FECHA_ACTUAL;

            window.dbVideos.forEach(v => {
                if (v.cierre_transmision < hoyStr) {
                    v.vigente = "FINALIZADO";
                } else {
                    v.vigente = "VIGENTE";
                }

                let inicio = new Date(v.inicio_transmision + "T00:00:00");
                let cierre = new Date(v.cierre_transmision + "T00:00:00");
                let hoy = new Date(hoyStr + "T00:00:00");

                let festivosEnRango = 0;
                let diasTransmisionCount = 0;
                let repeticionesAcumuladas = 0;

                let curr = new Date(inicio);
                while (curr <= cierre) {
                    let yyyy = curr.getFullYear();
                    let mm = String(curr.getMonth() + 1).padStart(2, '0');
                    let dd = String(curr.getDate()).padStart(2, '0');
                    let fStr = `${yyyy}-${mm}-${dd}`;

                    let dayOfWeek = curr.getDay();
                    let esFestivo = festivosSet.has(fStr);
                    let esAdicional = adicionalesSet.has(fStr);

                    let esLaboral = false;
                    if (esFestivo && !esAdicional) {
                        esLaboral = false;
                    } else if (dayOfWeek !== 0 || esAdicional) {
                        esLaboral = true;
                    }

                    if (esFestivo && curr >= inicio && curr <= cierre) {
                        festivosEnRango++;
                    }

                    if (esLaboral) {
                        diasTransmisionCount++;
                        if (curr <= hoy && curr <= cierre) {
                            let videosActivosHoy = window.dbVideos.filter(vid => fStr >= vid.inicio_transmision && fStr <= vid.cierre_transmision);
                            let sumaSegundosHoy = videosActivosHoy.reduce((acc, vid) => acc + duracionASegundos(vid.duracion), 0);

                            if (sumaSegundosHoy > 0) {
                                let durSeg = duracionASegundos(v.duracion);
                                let repDia = (3600 / sumaSegundosHoy) * 7 * (durSeg / 60);
                                repeticionesAcumuladas += repDia;
                            }
                        }
                    }
                    curr.setDate(curr.getDate() + 1);
                }

                v.festivos = festivosEnRango;
                v.dias_transmision = diasTransmisionCount;
                v.repeticiones = isNaN(repeticionesAcumuladas) ? 0 : repeticionesAcumuladas;
            });

            window.dbVideos.sort((a, b) => a.id_video.localeCompare(b.id_video, undefined, { numeric: true, sensitivity: 'base' }));
        }

        async function cargarDatosFirebase() {
            const querySnapshot = await getDocs(collection(db, "bd_videos"));
            window.dbVideos = [];
            querySnapshot.forEach((docSnap) => {
                window.dbVideos.push({ idDoc: docSnap.id, ...docSnap.data() });
            });

            if (window.dbVideos.length <= 1) {
                const batch = writeBatch(db);
                querySnapshot.forEach(d => batch.delete(d.ref));
                await batch.commit();

                const datosBase = [
                    { version: "¿Por qué es necesaria una nueva Distritación Electoral?", tematica: "Distritación", duracion: "00:00:39", inicio_transmision: "2025-01-01", cierre_transmision: "2025-12-31" },
                    { version: "Los criterios para conformar los nuevos distritos electorales", tematica: "Distritación", duracion: "00:00:50", inicio_transmision: "2025-01-01", cierre_transmision: "2025-12-31" },
                    { version: "Juventudes y Democracia", tematica: "Educacion Civica", duracion: "00:01:07", inicio_transmision: "2026-08-21", cierre_transmision: "2026-10-07" },
                    { version: "C5_SB_INICIA PEF 2026 2027", tematica: "Valor Institucional", duracion: "00:00:30", inicio_transmision: "2026-10-05", cierre_transmision: "2026-11-30" }
                ];

                for (let i = 0; i < datosBase.length; i++) {
                    let item = datosBase[i];
                    item.id_video = generarIdExcel(i);
                    await addDoc(collection(db, "bd_videos"), item);
                }

                const qReload = await getDocs(collection(db, "bd_videos"));
                window.dbVideos = [];
                qReload.forEach(d => window.dbVideos.push({ idDoc: d.id, ...d.data() }));
            }

            const calSnap = await getDocs(collection(db, "calendario_config"));
            window.dbCalendario = [];
            calSnap.forEach(d => window.dbCalendario.push({ idDoc: d.id, ...d.data() }));

            if (window.dbCalendario.length === 0) {
                const calOficiales = [
                    { tipo: "festivo", fecha: "2025-01-01", descripcion: "Año Nuevo" },
                    { tipo: "festivo", fecha: "2025-03-17", descripcion: "Natalicio Benito Juárez" },
                    { tipo: "adicional", fecha: "2025-01-04", descripcion: "sábado" }
                ];
                for (let item of calOficiales) {
                    await addDoc(collection(db, "calendario_config"), item);
                }
                const c2 = await getDocs(collection(db, "calendario_config"));
                window.dbCalendario = [];
                c2.forEach(d => window.dbCalendario.push({ idDoc: d.id, ...d.data() }));
            }

            procesarCalculosAutomaticos();
            renderizarTodo();
        }

        async function initApp() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            try {
                await cargarDatosFirebase();
                statusDot.classList.remove('bg-yellow-500', 'animate-pulse');
                statusDot.classList.add('bg-emerald-500');
                statusText.innerText = "Conectado a Firebase";
            } catch (error) {
                console.error("Error conectando a Firebase:", error);
                statusDot.classList.remove('bg-yellow-500', 'animate-pulse');
                statusDot.classList.add('bg-rose-500');
                statusText.innerText = "Error de conexión";
            }
        }

        window.cargarDatosFirebase = cargarDatosFirebase;
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
